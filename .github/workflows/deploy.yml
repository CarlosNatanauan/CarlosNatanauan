name: Deploy Astro site to Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Astro 7 requires >= 22.12.
          node-version: 22
          # Caches ~/.npm, so the miss path below re-downloads nothing.
          cache: npm

      # `npm ci` was 210s of a 4-minute pipeline — the build itself is 13s.
      # The tree only changes when the lockfile does, so key the whole of
      # node_modules on it and skip the install entirely the rest of the time.
      # Safe to cache wholesale here because the runner and Node version are
      # both pinned; bump the key's prefix if either changes.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-ubuntu-node22-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build
        run: npm run build

      # Gates the deploy on the built output, not the source: canonical URLs,
      # structured data, sitemap contents, image/video dimensions, and that no
      # email address is published. Fails the job before anything ships.
      - name: Verify build output
        run: npm run check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
